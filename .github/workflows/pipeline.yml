name: Pipeline Weather App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Ejecutar tests
        run: pnpm tests

      - name: Ejecutar build de la aplicación
        run: pnpm exec expo export -p web
        env:
          EXPO_PUBLIC_WEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}

      - name: Generar etiquetas en minúsculas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, weather-vm]
    steps:
      - name: Desplegar nueva versión
        run: |
          cd /opt/weather-app
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          [ -f .env ] && cp .env .env.previous
          echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" > .env
          docker compose pull
          docker compose up -d
          docker image prune -f

      - name: Verificar despliegue
        run: |
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8000 > /dev/null && echo "OK" && exit 0
            sleep 5
          done
          echo "La app no respondió"
          exit 1

      - name: Rollback si falló
        if: failure()
        run: |
          cd /opt/weather-app
          if [ -f .env.previous ]; then
            cp .env.previous .env
            docker compose up -d
            echo "Rollback realizado"
          fi
